# .github/workflows/deploy-on-vm.yml

name: Deploy to Azure VM via Traefik

on:
  repository_dispatch:
    types: [trigger-deploy]

jobs:
  deploy:
    runs-on: [self-hosted, linux]

    steps:
    
      - name: Ensure traefik network and container exist
        run: |
          # 1. Create Docker network if it doesn't exist
          if ! docker network ls --format '{{.Name}}' | grep -q "^traefik-net$"; then
            echo "[INFO] Creating traefik-net network..."
            docker network create traefik-net
          else
            echo "[INFO] traefik-net network already exists."
          fi

          # 2. Ensure traefik container is running
          if ! docker ps --format '{{.Names}}' | grep -q "^traefik$"; then
            echo "[INFO] Traefik container not running. Starting it..."
            docker run -d \
              --name traefik \
              --network traefik-net \
              -p 80:80 -p 443:443 -p 8080:8080 \
              -v /var/run/docker.sock:/var/run/docker.sock:ro \
              -v /home/ofir/silence-remover/traefik/traefik.yml:/etc/traefik/traefik.yml:ro \
              -v /home/ofir/silence-remover/traefik/acme.json:/letsencrypt/acme.json \
              traefik:v2.11 \
              --configFile=/etc/traefik/traefik.yml
          else
            echo "[INFO] Traefik container is already running."
          fi

      - name: Set deployment variables
        id: vars
        run: |
          echo "IMAGE_TAG=${{ github.event.client_payload.tag }}" >> $GITHUB_ENV
          echo "CONTAINER_NAME=silence-${{ github.event.client_payload.tag }}" >> $GITHUB_ENV

      - name: Pull image from Docker Hub
        run: docker pull ofirgaash/silence-remover:${{ env.IMAGE_TAG }}

      - name: Run new container (no Traefik labels yet)
        run: |
          docker run -d \
            --name $CONTAINER_NAME \
            --network traefik-net \
            ofirgaash/silence-remover:${{ env.IMAGE_TAG }}

      - name: Wait for health check
        run: |
          MAX_WAIT=120
          ELAPSED=0
          echo "[INFO] Waiting for container $CONTAINER_NAME to become healthy..."

          while [[ "$(docker inspect --format='{{.State.Health.Status}}' $CONTAINER_NAME 2>/dev/null)" != "healthy" ]]; do
            sleep 5
            ELAPSED=$((ELAPSED + 5))
            if [[ "$ELAPSED" -ge "$MAX_WAIT" ]]; then
              echo "[ERROR] Container $CONTAINER_NAME did not become healthy in time."
              docker logs $CONTAINER_NAME
              exit 1
            fi
          done

          echo "[INFO] $CONTAINER_NAME is healthy. Proceeding to attach Traefik labels..."

      - name: Attach Traefik labels
        run: |
          docker container update \
            --label-add traefik.enable=true \
            --label-add 'traefik.http.routers.silence.rule=Host("azure.ofirgaash.click")' \
            --label-add traefik.http.routers.silence.entrypoints=websecure \
            --label-add traefik.http.routers.silence.tls.certresolver=myresolver \
            --label-add traefik.http.services.silence.loadbalancer.server.port=80 \
            $CONTAINER_NAME

      - name: Clean up old containers
        run: |
          echo "[INFO] Cleaning up old containers..."
          docker ps -a --filter "name=silence-" --format "{{.Names}}" | grep -v "$CONTAINER_NAME" | xargs -r docker rm -f
