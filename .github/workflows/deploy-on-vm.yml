# .github/workflows/deploy-on-vm.yml

name: Deploy to Azure VM via Traefik

on:
  repository_dispatch:
    types: [trigger-deploy]

jobs:
  deploy:
    runs-on: [azure]
    # pull the payload tag (if any) into CLIENT_TAG
    env:
      CLIENT_TAG: ${{ github.event.client_payload.tag }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Prepare deployment variables
        # default shell is bash on GitHub-hosted runners
        run: |
          # if CLIENT_TAG is empty or unset, TAG => "latest"
          TAG="${CLIENT_TAG:-latest}"
          echo "IMAGE_TAG=$TAG"         >> "$GITHUB_ENV"
          echo "CONTAINER_NAME=silence-$TAG"     >> "$GITHUB_ENV"
          echo "TMP_CONTAINER=silence-${TAG}-tmp" >> "$GITHUB_ENV"

      - name: Prune stale containers
        run: |
          for name in "$TMP_CONTAINER" "$CONTAINER_NAME"; do
            if docker ps -a \
                 --filter "name=^/${name}$" \
                 --format '{{.Names}}' \
               | grep -q "^${name}$"; then
              echo "[INFO] Removing stale container: $name"
              docker rm -f "$name"
            fi
          done

      - name: Ensure traefik network exists
        run: |
          # 1. Create Docker network if it doesn't exist
          if ! docker network ls --format '{{.Name}}' | grep -q "^traefik-net$"; then
            echo "[INFO] Creating traefik-net network..."
            docker network create traefik-net
          else
            echo "[INFO] traefik-net network already exists."
          fi

      - name: Ensure Traefik is running
        run: |
          if docker ps -a --format '{{.Names}}' | grep -q "^traefik$"; then
            echo "[INFO] Traefik container already exists. Ensuring it's running..."
            docker start traefik || true
          else
            echo "[INFO] Starting Traefik with Compose..."
            docker compose -f traefik/docker-compose.traefik.yml up -d traefik
          fi

      - name: Pull image from Docker Hub
        run: docker pull ofirgaash/silence-remover:${{ env.IMAGE_TAG }}

      - name: Run new container (no Traefik labels yet)
        run: |
          docker run -d \
            --name "$TMP_CONTAINER" \
            --network traefik-net \
            ofirgaash/silence-remover:${{ env.IMAGE_TAG }}

      - name: Wait for test container health
        run: |
          echo "[INFO] Waiting for container $TMP_CONTAINER to become healthy..."
          MAX_WAIT=120; ELAPSED=0
          until [ "$ELAPSED" -ge "$MAX_WAIT" ] || \
                [ "$(docker inspect --format='{{.State.Health.Status}}' $TMP_CONTAINER 2>/dev/null)" = "healthy" ]; do
            sleep 5
            ELAPSED=$((ELAPSED + 5))
          done

          if [ "$ELAPSED" -ge "$MAX_WAIT" ]; then
            echo "[ERROR] $TMP_CONTAINER did not become healthy in time."
            docker logs $TMP_CONTAINER
            exit 1
          fi

      - name: Run live container with Traefik labels
        run: |
          echo "[INFO] Running production container with Traefik labels..."
          docker run -d \
            --name "$CONTAINER_NAME" \
            --network traefik-net \
            --restart unless-stopped \
            -l traefik.enable=true \
            -l 'traefik.http.routers.silence.rule=Host("azure.ofirgaash.click")' \
            -l traefik.http.routers.silence.entrypoints=websecure \
            -l traefik.http.routers.silence.tls.certresolver=myresolver \
            -l traefik.http.services.silence.loadbalancer.server.port=80 \
            ofirgaash/silence-remover:${{ env.IMAGE_TAG }}

      - name: Wait for live container to become healthy
        run: |
          echo "[INFO] Waiting for production container $CONTAINER_NAME to become healthy..."
          MAX_WAIT=120; ELAPSED=0
          until [ "$ELAPSED" -ge "$MAX_WAIT" ] || \
                [ "$(docker inspect --format='{{.State.Health.Status}}' $CONTAINER_NAME 2>/dev/null)" = "healthy" ]; do
            sleep 5
            ELAPSED=$((ELAPSED + 5))
          done

          if [ "$ELAPSED" -ge "$MAX_WAIT" ]; then
            echo "[ERROR] $CONTAINER_NAME did not become healthy in time."
            docker logs $CONTAINER_NAME
            exit 1
          fi

      - name: Cleanup old containers (excluding new one)
        run: |
          echo "[INFO] Cleaning up old silence-* containers..."
          docker ps -a --filter "name=silence-" --format '{{.Names}}' \
            | grep -v "^${CONTAINER_NAME}$" \
            | grep -v "^${TMP_CONTAINER}$" \
            | xargs -r docker rm -f

      - name: Remove temp container
        run: |
          echo "[INFO] Removing temporary test container $TMP_CONTAINER..."
          docker rm -f "$TMP_CONTAINER" || true
