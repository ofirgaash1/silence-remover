name: Test, Build and Push to Docker Hub

on:
  push:
    branches: [master]

jobs:
  build-artifact:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install and build
        working-directory: ./app
        run: |
          npm ci
          npm run build

      - name: Generate tag
        id: tag
        run: echo "tag=v$(date +'%Y%m%d-%H%M%S')" >> $GITHUB_OUTPUT

      - name: Upload dist/ artifact
        uses: actions/upload-artifact@v3
        with:
          name: app-dist
          path: ./app/dist


  sonarcloud:
    runs-on: ubuntu-latest
    needs: build-artifact

    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install deps
        run: npm ci
        working-directory: ./app

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@v2
        with:
          projectBaseDir: ./app
          args: >
            -Dsonar.projectKey=ofirgaash1_silence-remover
            -Dsonar.organization=ofirgaash1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Wait for Quality Gate result
        uses: SonarSource/sonarcloud-quality-gate-action@v1.1.0
        with:
          sonar-token: ${{ secrets.SONAR_TOKEN }}

  dockerize-and-push:
    needs: [build-artifact, sonarcloud]
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: ofirgaash/silence-remover
    steps:
      - uses: actions/checkout@v3

      - name: Download dist
        uses: actions/download-artifact@v3
        with:
          name: app-dist
          path: ./app/dist

      - name: Docker login
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Build + tag
        run: |
          docker build -t $IMAGE_NAME:${{ needs.build-artifact.outputs.tag }} ./app
          docker tag $IMAGE_NAME:${{ needs.build-artifact.outputs.tag }} $IMAGE_NAME:latest

      - name: Push
        run: |
          docker push $IMAGE_NAME:${{ needs.build-artifact.outputs.tag }}
          docker push $IMAGE_NAME:latest

      - name: Trigger deploy
        run: |
          curl -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            https://api.github.com/repos/${{ github.repository }}/dispatches \
            -d '{"event_type":"trigger-deploy", "client_payload": {"tag": "${{ needs.build-artifact.outputs.tag }}"}}'
