name: Desktop Installers

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform }} Installer
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            build_script: dist:win
          - os: macos-latest
            platform: macos
            build_script: dist:mac

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            silence-cutter-desktop/package-lock.json

      - name: Install and build web app
        working-directory: app
        run: |
          npm ci
          npm run build

      - name: Install desktop dependencies
        working-directory: silence-cutter-desktop
        run: npm ci

      - name: Prepare FFmpeg (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "silence-cutter-desktop/bin" | Out-Null
          choco install ffmpeg -y --no-progress
          $ffmpegPath = Get-ChildItem -Path "C:\ProgramData\chocolatey\lib\ffmpeg\tools" -Filter "ffmpeg.exe" -Recurse |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $ffmpegPath) {
            throw "Unable to locate a real ffmpeg.exe binary after Chocolatey install."
          }
          Copy-Item -LiteralPath $ffmpegPath -Destination "silence-cutter-desktop/bin/ffmpeg.exe" -Force

      - name: Prepare FFmpeg (macOS)
        if: matrix.platform == 'macos'
        run: |
          mkdir -p silence-cutter-desktop/bin
          brew install ffmpeg
          cp "$(command -v ffmpeg)" silence-cutter-desktop/bin/ffmpeg
          chmod +x silence-cutter-desktop/bin/ffmpeg

      - name: Validate macOS signing and notarization secrets
        if: matrix.platform == 'macos'
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          missing=0
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_API_KEY_P8 APPLE_API_KEY_ID APPLE_API_ISSUER; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required macOS release secret: $name"
              missing=1
            fi
          done

          if [ "$missing" -ne 0 ]; then
            echo "::error::Mac DMG releases must be signed and notarized. Add the missing secrets before publishing."
            exit 1
          fi

      - name: Prepare App Store Connect API key
        id: mac-notary-key
        if: matrix.platform == 'macos'
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          api_key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "$APPLE_API_KEY_P8" > "$api_key_path"
          chmod 600 "$api_key_path"
          echo "path=$api_key_path" >> "$GITHUB_OUTPUT"

      - name: Build installer
        working-directory: silence-cutter-desktop
        run: npm run ${{ matrix.build_script }}
        env:
          CSC_LINK: ${{ matrix.platform == 'macos' && secrets.CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.platform == 'macos' && secrets.CSC_KEY_PASSWORD || '' }}
          APPLE_API_KEY: ${{ matrix.platform == 'macos' && steps.mac-notary-key.outputs.path || '' }}
          APPLE_API_KEY_ID: ${{ matrix.platform == 'macos' && secrets.APPLE_API_KEY_ID || '' }}
          APPLE_API_ISSUER: ${{ matrix.platform == 'macos' && secrets.APPLE_API_ISSUER || '' }}

      - name: Verify macOS codesign and notarization
        if: matrix.platform == 'macos'
        working-directory: silence-cutter-desktop
        run: |
          app_path="$(find dist -type d -name '*.app' | head -n 1)"
          dmg_path="$(find dist -maxdepth 1 -type f -name '*.dmg' | head -n 1)"

          if [ -z "$app_path" ] || [ -z "$dmg_path" ]; then
            echo "::error::Unable to locate the built macOS app bundle or DMG."
            exit 1
          fi

          codesign --verify --deep --strict --verbose=2 "$app_path"
          xcrun stapler validate "$app_path"
          xcrun stapler validate "$dmg_path"
          spctl -a -vvv -t install "$dmg_path"

      - name: Upload Windows installer artifact
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: installer-windows
          path: |
            silence-cutter-desktop/dist/*.exe
            silence-cutter-desktop/dist/latest*.yml
          if-no-files-found: error

      - name: Upload macOS installer artifact
        if: matrix.platform == 'macos'
        uses: actions/upload-artifact@v4
        with:
          name: installer-macos
          path: |
            silence-cutter-desktop/dist/*.dmg
            silence-cutter-desktop/dist/latest*.yml
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download installer artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
