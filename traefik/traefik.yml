 entryPoints:
   web:
     address: ":80"
     http:
       redirections:
         entryPoint:
           to: websecure
           scheme: https

   websecure:
     address: ":443"

   traefik:
     address: ":8080"

 certificatesResolvers:
   myresolver:
     acme:
       email: ofir@ofirgaash.click
       storage: /letsencrypt/acme.json
       httpChallenge:
         entryPoint: web

 providers:
   docker:
     exposedByDefault: false
     
   file:
     directory: /etc/traefik/dynamic
     watch: true

 api:
   dashboard: true
   insecure: true
