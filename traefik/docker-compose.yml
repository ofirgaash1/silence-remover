version: '3.8'

services:
  traefik:
    image: traefik:v2.11
    container_name: traefik
    command:
      - "--configFile=/etc/traefik/traefik.yml"
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"  # Dashboard
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "./traefik.yml:/etc/traefik/traefik.yml:ro"
      - "./acme.json:/letsencrypt/acme.json"

  app-v1:
    build: ../app-v1
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.silence.rule=Host(`azure.ofirgaash.click`)"
      - "traefik.http.routers.silence.entrypoints=websecure"
      - "traefik.http.routers.silence.tls.certresolver=myresolver"
      - "traefik.http.services.silence.loadbalancer.server.port=80"

  app-v2:
    build: ../app-v2
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.silence.rule=Host(`azure.ofirgaash.click`)"
      - "traefik.http.routers.silence.entrypoints=websecure"
      - "traefik.http.routers.silence.tls.certresolver=myresolver"
      - "traefik.http.services.silence.loadbalancer.server.port=80"
